seed: 42
dataset_config: configs/dataset.yaml
model:
  name: gru
  hidden: 256
  layers: 2
  dropout: 0.1
  kernel_size: 3
  aux_motion: true
  max_params_m: 2.0
  predict_sequence: true
features:
  zero_2d: false
  zero_accel: true
  multilag: false
  multilag_steps:
  - 1
  - 3
  - 6
optim:
  name: adamw
  lr: 0.0003
  weight_decay: 0.01
  epochs: 60
  batch_size: 256
  grad_clip: 1.0
  warmup_epochs: 3
  hard_warmup_epochs: 5
  amp: true
loss:
  huber_delta: 0.05
  w_delta: 1.0
  w_passthrough: 0.5
  w_bone: 0.0
  w_bone_len: 0.0
  w_smooth: 0.0
  w_aux: 0.0
  w_reach: 0.0
  w_angle: 0.0
  w_vel: 0.003
  w_dir: 0.0
  w_z_extend: 0.005
  z_weight: 1.0
  dir_reach_thr: 0.7
  reach_mode: hinge
  reach_thr: 0.85
  elbow_thr_deg: 160.0
  z_extend_reach_thr: 0.85
  z_extend_elbow_thr_deg: 160.0
  z_extend_min_depth: 0.05
  geometry_warmup_epochs: 3
  label_smoothing: 0.1
  shoulder_weight: 1.0
  elbow_weight: 1.0
  wrist_weight: 1.4
  sequence_position_mode: last
eval:
  every_epochs: 1
  early_stop_metric: val/mpjpe_hard_mm
  early_stop_mode: min
  patience: 12
  easy_max_regression: 0.03
logging:
  dir: runs
  run_name: abl2_lastpos_vel003_zextend
  tensorboard: true
  jsonl: true
inference_gate:
  conf_high: 0.85
  delta_eps: 0.02
_competition:
  team: phase2
  notes: lastpos_vel003 + teacher-gated wrist-relative Z extension
  override: phase2_lastpos_vel003_zextend.yaml
