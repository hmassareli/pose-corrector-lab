<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pose Lab Viewer</title>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --line: #2a3340;
      --text: #e7ecf3;
      --muted: #8b98a8;
      --accent: #3ddea5;
      --accent2: #6ea8fe;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "IBM Plex Sans", system-ui, sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #141a22, #0e1116);
    }
    header h1 {
      font-size: 0.95rem; font-weight: 600; margin: 0;
      letter-spacing: 0.02em;
    }
    header .meta { color: var(--muted); font-size: 0.8rem; }
    header select, header button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
    }
    header button { cursor: pointer; }
    header button:hover { border-color: var(--accent); }
    header button.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(61, 222, 165, 0.08);
    }
    header .nav-tabs { display: inline-flex; gap: 0.35rem; }
    header .nav-tabs a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 0.3rem 0.55rem;
      border-radius: 6px;
      border: 1px solid transparent;
    }
    header .nav-tabs a:hover { color: var(--text); border-color: var(--line); }
    header .nav-tabs a.on {
      color: var(--accent);
      border-color: var(--accent);
      background: rgba(61, 222, 165, 0.08);
    }
    header .source-bar {
      display: inline-flex; gap: 0.3rem; flex-wrap: wrap;
      margin-left: 0.25rem;
    }
    header .source-bar button {
      font-size: 0.78rem;
      padding: 0.3rem 0.55rem;
    }
    header .spacer { flex: 1; }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100% - 52px);
      gap: 1px;
      background: var(--line);
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 45% 55%; }
    }
    .pane {
      background: var(--panel);
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .pane-label {
      position: absolute; top: 10px; left: 12px; z-index: 2;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); pointer-events: none;
    }
    #videoWrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background:
        radial-gradient(ellipse at 30% 20%, #1a2433 0%, transparent 50%),
        var(--bg);
    }
    video {
      max-width: 100%; max-height: 100%;
      background: #000;
    }
    #viewport3d {
      position: absolute;
      inset: 0;
      touch-action: none;
      cursor: grab;
      background: var(--bg);
    }
    #viewport3d:active { cursor: grabbing; }
    #canvas3d {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    .controls {
      position: absolute; bottom: 12px; left: 12px; right: 12px;
      display: flex; gap: 0.5rem; align-items: center;
      z-index: 3;
      background: rgba(14,17,22,0.72);
      backdrop-filter: blur(8px);
      padding: 0.45rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      pointer-events: auto;
    }
    .controls input[type="range"] { flex: 1; min-width: 0; }
    .controls .time { font-variant-numeric: tabular-nums; font-size: 0.8rem; color: var(--muted); min-width: 72px; }
    .controls .frame-jump {
      display: flex; align-items: center; gap: 0.3rem;
      flex-shrink: 0;
    }
    .controls .frame-jump input[type="number"] {
      width: 4.6rem;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.25rem 0.35rem;
      font-size: 0.8rem;
      font-variant-numeric: tabular-nums;
    }
    .controls .frame-jump button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .controls .frame-jump button:hover { border-color: var(--accent); }
    .hint {
      position: absolute; top: 10px; right: 12px; z-index: 2;
      font-size: 0.72rem; color: var(--muted);
      pointer-events: none;
      max-width: 42%;
      text-align: right;
    }
    .status-chip {
      position: absolute; top: 36px; right: 12px; z-index: 3;
      display: none;
      align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(14,17,22,0.82);
      backdrop-filter: blur(8px);
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .status-chip.on { display: inline-flex; }
    .status-chip .dot {
      width: 0.55rem; height: 0.55rem; border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 0 transparent;
    }
    .status-chip.corrected .dot {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(61, 222, 165, 0.65);
    }
    .status-chip.passthrough .dot {
      background: #6b7785;
    }
    .controls label.toggle,
    .controls .toggle {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.75rem; color: var(--muted);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .controls label.toggle { gap: 0.7rem; }
    .controls .toggle input { accent-color: var(--accent); }
    .err {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 2rem; text-align: center; color: #ff8e8e;
      z-index: 4;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pose Corrector Lab</h1>
    <nav class="nav-tabs" aria-label="Modo">
      <a class="on" href="/" id="navOffline">Offline</a>
      <a href="/live" id="navLive">Live</a>
    </nav>
    <div class="source-bar" id="sourceBar" title="Fonte dos joints">
      <button type="button" data-source="mediapipe">MediaPipe</button>
      <button type="button" data-source="teacher">Teacher</button>
      <button type="button" data-source="teacher_aligned">Teacher aligned</button>
      <button type="button" data-source="corrected">Corrector exportado</button>
      <button type="button" data-source="nlf_s">NLF-S</button>
    </div>
    <span class="meta" id="sourceBadge" style="color:var(--accent);font-weight:600">—</span>
    <span class="meta" id="titleMeta">carregando…</span>
    <select id="clipSelect" title="Clips"></select>
    <button type="button" id="btnReload">Reload</button>
    <button type="button" id="btnAvatar">Avatar 3D</button>
    <button type="button" id="btnResetCam">Reset camera</button>
    <span class="spacer"></span>
  </header>
  <div class="layout">
    <div class="pane">
      <div class="pane-label">Video</div>
      <div id="videoWrap"><video id="video" playsinline controls></video></div>
    </div>
    <div class="pane" id="pane3d">
      <div class="pane-label">Skeleton 3D</div>
      <div class="hint">arrastar = orbit · scroll = zoom · botão direito = pan · space = play</div>
      <div class="status-chip" id="corrChip" title="Frame corrigido vs MediaPipe (juntas alvo)">
        <span class="dot" aria-hidden="true"></span>
        <span id="corrChipText">—</span>
      </div>
      <div id="viewport3d">
        <canvas id="canvas3d"></canvas>
      </div>
      <div class="controls" id="transport">
        <button type="button" id="btnPlay">Play</button>
        <input type="range" id="scrub" min="0" max="0" value="0" step="1" />
        <span class="time" id="timeLabel">0 / 0</span>
        <div class="frame-jump">
          <input type="number" id="frameInput" min="0" step="1" value="0" title="Frame number" />
          <button type="button" id="btnGo" title="Jump to frame">Go</button>
        </div>
        <label class="toggle" id="overlayToggleWrap" hidden>
          <span class="toggle" title="Overlay do MediaPipe original">
            <input type="checkbox" id="chkShadow" />
            Sombra MP
          </span>
          <span class="toggle" id="teacherToggleWrap" title="Overlay do teacher aligned (mesmo frame)">
            <input type="checkbox" id="chkTeacher" />
            <span id="chkTeacherLabel">Teacher</span>
          </span>
          <span class="toggle" id="corrShadowToggleWrap" hidden title="Overlay do MP + corretor exportado">
            <input type="checkbox" id="chkCorrShadow" />
            Sombra MP+corretor
          </span>
        </label>
        <label class="toggle" id="oracleToggleWrap" hidden
          title="Mostra MediaPipe + o delta real salvo no dataset; nao executa a rede nem aplica gate.">
          <input type="checkbox" id="chkOracle" disabled />
          Oraculo treino: MP + delta real
        </label>
      </div>
      <div class="err" id="err" hidden></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
    import { clone as cloneSkeleton } from "three/addons/utils/SkeletonUtils.js";
    import {
      buildAvatarRig,
      createAvatarMotion,
      resetAvatarMotion,
      resetRetargetFilters,
      updateAvatarPose as applyMikapoAvatarPose,
      MP_AUX,
      auxFromSmpl,
      footDirectionsFromSmplAux,
      headForwardFromSmplAux,
    } from "/static/mikapo_mixamo_solver.js";

    const params = new URLSearchParams(location.search);
    let clip = params.get("clip") || "";
    let dataSource = params.get("source") || "corrected";

    const video = document.getElementById("video");
    const scrub = document.getElementById("scrub");
    const timeLabel = document.getElementById("timeLabel");
    const frameInput = document.getElementById("frameInput");
    const btnGo = document.getElementById("btnGo");
    const titleMeta = document.getElementById("titleMeta");
    const sourceBadge = document.getElementById("sourceBadge");
    const errBox = document.getElementById("err");
    const clipSelect = document.getElementById("clipSelect");
    const btnPlay = document.getElementById("btnPlay");
    const btnAvatar = document.getElementById("btnAvatar");
    const sourceBar = document.getElementById("sourceBar");

    const SOURCE_LABELS = {
      mediapipe: "MediaPipe",
      teacher: "Teacher (GVHMR)",
      teacher_aligned: "Teacher aligned",
      corrected: "Corrector exportado",
      nlf_s: "NLF-S",
    };

    let payload = null;
    let jointMeshes = [];
    let boneLines = null;
    let nameToIndex = {};
    let avatar = null;
    let avatarShadow = null;
    let avatarShadowCorr = null;
    let avatarRig = null;
    let avatarShadowRig = null;
    let avatarShadowCorrRig = null;
    let avatarMode = false;
    let avatarLoadPromise = null;
    let avatarFootLandmarks = null;
    /** Pose-33 head/palm aux from /api/pose-aux.json (MediaPipe viewer space). */
    let poseAux = null;
    let trainingOracle = null;
    const AVATAR_URL = "/assets/Ch28_nonPBR.fbx";
    const avatarMotion = createAvatarMotion();
    const avatarShadowMotion = createAvatarMotion();
    const avatarShadowCorrMotion = createAvatarMotion();
    /** Bumps on every clip/source load so stale fetches cannot paint error overlays. */
    let loadGen = 0;
    /** Suppress clipSelect "change" while we rebuild options on source switch. */
    let suppressClipChange = false;

    function syncSourceButtons() {
      for (const btn of sourceBar.querySelectorAll("button[data-source]")) {
        btn.classList.toggle("active", btn.dataset.source === dataSource);
      }
    }

    function sourceLabel(src) {
      return SOURCE_LABELS[src] || src || "unknown";
    }
    /** When non-null, user jump/scrub owns the frame until video seek completes. */
    let seekLockFi = null;
    /** Bumps on every seek request so stale `seeked` events are ignored. */
    let seekGen = 0;
    let seekClearTimer = null;
    /** True while the user is dragging the timeline — video must not fight the slider. */
    let scrubbing = false;
    let scrubRaf = 0;

    const COMPARE_JOINTS = [
      "left_shoulder", "right_shoulder",
      "left_elbow", "right_elbow",
      "left_wrist", "right_wrist",
    ];
    /** World-unit mean displacement on target joints → treat frame as corrected. */
    const CORRECTED_EPS = 0.008;

    const corrChip = document.getElementById("corrChip");
    const corrChipText = document.getElementById("corrChipText");
    const overlayToggleWrap = document.getElementById("overlayToggleWrap");
    const teacherToggleWrap = document.getElementById("teacherToggleWrap");
    const corrShadowToggleWrap = document.getElementById("corrShadowToggleWrap");
    const chkShadow = document.getElementById("chkShadow");
    const chkTeacher = document.getElementById("chkTeacher");
    const chkTeacherLabel = document.getElementById("chkTeacherLabel");
    const chkCorrShadow = document.getElementById("chkCorrShadow");
    const oracleToggleWrap = document.getElementById("oracleToggleWrap");
    const chkOracle = document.getElementById("chkOracle");

    function makeGhostOverlay({ color, opacity = 0.4 }) {
      return {
        payload: null,
        jointMeshes: [],
        boneLines: null,
        nameToIndex: {},
        clear() {
          for (const m of this.jointMeshes) scene.remove(m);
          this.jointMeshes = [];
          if (this.boneLines) { scene.remove(this.boneLines); this.boneLines = null; }
          this.nameToIndex = {};
        },
        setVisible(on) {
          for (const m of this.jointMeshes) m.visible = on;
          if (this.boneLines) this.boneLines.visible = on;
        },
        build(jointNames, bones) {
          this.clear();
          this.nameToIndex = Object.fromEntries(jointNames.map((n, i) => [n, i]));
          const geo = new THREE.SphereGeometry(0.022, 12, 12);
          const mat = new THREE.MeshStandardMaterial({
            color,
            roughness: 0.55,
            metalness: 0.05,
            transparent: true,
            opacity,
            depthWrite: false,
          });
          for (const name of jointNames) {
            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData.name = name;
            mesh.visible = false;
            scene.add(mesh);
            this.jointMeshes.push(mesh);
          }
          const positions = new Float32Array(bones.length * 2 * 3);
          const bgeo = new THREE.BufferGeometry();
          bgeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
          this.boneLines = new THREE.LineSegments(
            bgeo,
            new THREE.LineBasicMaterial({
              color,
              transparent: true,
              opacity: Math.max(0.2, opacity - 0.08),
              depthWrite: false,
            }),
          );
          this.boneLines.userData.bones = bones;
          this.boneLines.visible = false;
          scene.add(this.boneLines);
        },
        updateFrame(fi) {
          if (!this.payload || !this.boneLines || !this.jointMeshes.length) return null;
          const frames = this.payload.frames;
          const si = Math.min(fi, frames.length - 1);
          const S = frames[si];
          for (let i = 0; i < this.jointMeshes.length; i++) {
            const p = S[i];
            if (!p) continue;
            this.jointMeshes[i].position.set(p[0], p[1], p[2]);
          }
          const bones = this.boneLines.userData.bones;
          const arr = this.boneLines.geometry.attributes.position.array;
          let o = 0;
          for (const b of bones) {
            const ia = this.nameToIndex[b.a], ib = this.nameToIndex[b.b];
            const a = S[ia], c = S[ib];
            arr[o++] = a[0]; arr[o++] = a[1]; arr[o++] = a[2];
            arr[o++] = c[0]; arr[o++] = c[1]; arr[o++] = c[2];
          }
          this.boneLines.geometry.attributes.position.needsUpdate = true;
          return S;
        },
      };
    }

    const viewport = document.getElementById("viewport3d");
    const canvas = document.getElementById("canvas3d");
    const transport = document.getElementById("transport");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x222a31, 1);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
    const DEFAULT_CAM_POS = new THREE.Vector3(2.2, 1.6, 2.8);
    const DEFAULT_TARGET = new THREE.Vector3(0, 0.9, 0);
    camera.position.copy(DEFAULT_CAM_POS);

    // Ghost overlays: orange = MediaPipe, violet = teacher, teal = MP+corrector.
    const mpOverlay = makeGhostOverlay({ color: 0xff8c42, opacity: 0.42 });
    const teacherOverlay = makeGhostOverlay({ color: 0xb794f6, opacity: 0.42 });
    const corrOverlay = makeGhostOverlay({ color: 0x3ddea5, opacity: 0.40 });

    const controls = new OrbitControls(camera, viewport);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.enableZoom = true;
    controls.enableRotate = true;
    controls.screenSpacePanning = true;
    controls.rotateSpeed = 0.9;
    controls.zoomSpeed = 1.1;
    controls.panSpeed = 0.8;
    controls.minDistance = 0.35;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI * 0.95;
    controls.target.copy(DEFAULT_TARGET);
    controls.update();

    viewport.addEventListener("wheel", (e) => e.preventDefault(), { passive: false });
    transport.addEventListener("pointerdown", (e) => e.stopPropagation());

    scene.add(new THREE.HemisphereLight(0xb8e8ef, 0x27202b, 2.5));
    scene.add(new THREE.AmbientLight(0xffffff, 0.85));
    const key = new THREE.DirectionalLight(0xffffff, 2.2);
    key.position.set(2, 3, 2);
    key.castShadow = true;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x9fc8ff, 1.2);
    fill.position.set(-3, 1.5, 2);
    scene.add(fill);
    const cameraLight = new THREE.PointLight(0xffffff, 10, 8, 2);
    scene.add(cameraLight);

    const grid = new THREE.GridHelper(3, 12, 0x2a3340, 0x1a222c);
    scene.add(grid);
    const axes = new THREE.AxesHelper(0.35);
    scene.add(axes);

    function resize() {
      const w = viewport.clientWidth, h = viewport.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(resize).observe(viewport);
    }

    function frameCameraOnSkeleton(frames) {
      if (!frames || !frames.length) {
        camera.position.copy(DEFAULT_CAM_POS);
        controls.target.copy(DEFAULT_TARGET);
        controls.update();
        return;
      }
      const mid = frames[Math.floor(frames.length / 2)] || frames[0];
      const pelvis = mid[0] || [0, 0, 0];
      const neck = mid[14] || pelvis;
      const target = new THREE.Vector3(
        (pelvis[0] + neck[0]) * 0.5,
        (pelvis[1] + neck[1]) * 0.5,
        (pelvis[2] + neck[2]) * 0.5,
      );
      controls.target.copy(target);
      camera.position.set(target.x + 2.0, target.y + 0.9, target.z + 2.6);
      controls.update();
    }

    function clearSkeleton() {
      for (const m of jointMeshes) scene.remove(m);
      jointMeshes = [];
      if (boneLines) { scene.remove(boneLines); boneLines = null; }
    }

    function buildSkeleton(jointNames, bones) {
      clearSkeleton();
      nameToIndex = Object.fromEntries(jointNames.map((n, i) => [n, i]));
      const geo = new THREE.SphereGeometry(0.028, 16, 16);
      const mat = new THREE.MeshStandardMaterial({ color: 0x3ddea5, roughness: 0.35, metalness: 0.1 });
      const matTarget = new THREE.MeshStandardMaterial({ color: 0x6ea8fe, roughness: 0.35, metalness: 0.1 });
      const targets = new Set([
        "left_shoulder", "right_shoulder",
        "left_elbow", "right_elbow",
        "left_wrist", "right_wrist",
      ]);
      for (const name of jointNames) {
        const mesh = new THREE.Mesh(geo, targets.has(name) ? matTarget : mat);
        mesh.userData.name = name;
        scene.add(mesh);
        jointMeshes.push(mesh);
      }
      const positions = new Float32Array(bones.length * 2 * 3);
      const bgeo = new THREE.BufferGeometry();
      bgeo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      boneLines = new THREE.LineSegments(
        bgeo,
        new THREE.LineBasicMaterial({ color: 0xc5d0de })
      );
      boneLines.userData.bones = bones;
      scene.add(boneLines);
    }

    function auxForFrame(fi) {
      // Prefer NLF/SMPL avatar aux when present (aligned with body).
      if (poseAux?.kind === "smpl" && poseAux?.frames?.[fi]) {
        const row = poseAux.frames[fi];
        const names = poseAux.names;
        if (!names || row.length !== names.length) return null;
        const dict = {};
        for (let i = 0; i < names.length; i++) {
          dict[names[i]] = new THREE.Vector3(...row[i]);
        }
        return auxFromSmpl(dict, false);
      }
      if (!poseAux?.frames?.[fi]) return null;
      const row = poseAux.frames[fi];
      const names = poseAux.names;
      if (!names || row.length !== names.length) return null;
      const dict = {};
      for (let i = 0; i < names.length; i++) {
        dict[names[i]] = new THREE.Vector3(...row[i]);
      }
      // Validate required keys for head/hands (Pose-33)
      for (const k of Object.keys(MP_AUX)) {
        if (!dict[k]) return null;
      }
      dict.kind = "pose33";
      return dict;
    }

    /** MiKaPo-style Mixamo FK (see /static/mikapo_mixamo_solver.js). */
    function updateAvatarPose(model, rig, pose, motion, footFrame = null, bodyFrame = null, allowFeet = false, fi = 0) {
      const aux = auxForFrame(fi);
      const feet = aux?.kind === "smpl" ? footDirectionsFromSmplAux(aux) : null;
      const headFwd = aux?.kind === "smpl" ? headForwardFromSmplAux(aux) : null;
      applyMikapoAvatarPose({
        model,
        rig,
        pose,
        nameToIndex,
        motion,
        footFrame,
        bodyFrame,
        allowFeet,
        footMode: "yawFromDir",
        footDirections: feet,
        headForward: headFwd,
        aux,
        plantGround: true,
        groundY: 0,
        timestampMs: performance.now(),
        useWitness: true,
      });
    }

    function overlaysEnabled() {
      return dataSource === "corrected" || dataSource === "nlf_s";
    }

    function syncAvatarVisibility() {
      const showMpShadow =
        avatarMode && overlaysEnabled() && chkShadow.checked && !!mpOverlay.payload;
      const showCorrAvatar =
        avatarMode && dataSource === "nlf_s" && chkCorrShadow.checked && !!corrOverlay.payload;
      if (avatar) avatar.visible = avatarMode;
      if (avatarShadow) avatarShadow.visible = showMpShadow;
      if (avatarShadowCorr) avatarShadowCorr.visible = showCorrAvatar;
      for (const mesh of jointMeshes) mesh.visible = !avatarMode;
      if (boneLines) boneLines.visible = !avatarMode;
      mpOverlay.setVisible(!avatarMode && chkShadow.checked);
      teacherOverlay.setVisible(
        !avatarMode && dataSource === "corrected" && chkTeacher.checked,
      );
      corrOverlay.setVisible(
        !avatarMode && dataSource === "nlf_s" && chkCorrShadow.checked,
      );
    }

    async function loadAvatar() {
      if (avatar) return avatar;
      if (avatarLoadPromise) return avatarLoadPromise;
      btnAvatar.disabled = true;
      btnAvatar.textContent = "Carregando avatar…";
      avatarLoadPromise = new FBXLoader().loadAsync(AVATAR_URL).then((model) => {
        const outfitColors = { Ch28_Hoody: 0x0e7490, Ch28_Pants: 0x1d4ed8, Ch28_Sneakers: 0xf1f5f9 };
        model.scale.setScalar(0.01);
        model.traverse((node) => {
          if (!node.isMesh) return;
          node.castShadow = true;
          node.receiveShadow = true;
          const outfitColor = outfitColors[node.name];
          const materials = (Array.isArray(node.material) ? node.material : [node.material])
            .map((material) => outfitColor ? material.clone() : material);
          node.material = Array.isArray(node.material) ? materials : materials[0];
          for (const material of materials) {
            if (outfitColor) {
              material.map = null;
              material.emissiveMap = null;
              material.color.setHex(outfitColor);
              material.emissive.setHex(outfitColor);
              material.emissiveIntensity = 0.12;
            } else if (material.map) {
              material.map.colorSpace = THREE.SRGBColorSpace;
              material.color.setRGB(1, 1, 1);
              material.emissiveMap = material.map;
              material.emissive.setRGB(1, 1, 1);
              material.emissiveIntensity = 0.48;
            }
            material.needsUpdate = true;
          }
        });
        avatar = model;
        avatarRig = buildAvatarRig(avatar);
        if (avatarRig.bones.size < 4) throw new Error("O FBX não expôs ossos compatíveis com Mixamo");
        const makeShadowClone = (colorHex) => {
          const clone = cloneSkeleton(avatar);
          clone.traverse((node) => {
            if (!node.isMesh) return;
            node.castShadow = false;
            node.receiveShadow = false;
            const shadowMaterial = new THREE.MeshBasicMaterial({
              color: colorHex, transparent: true, opacity: 0.34, depthWrite: false,
            });
            node.material = Array.isArray(node.material)
              ? node.material.map(() => shadowMaterial.clone())
              : shadowMaterial;
          });
          return clone;
        };
        avatarShadow = makeShadowClone(0x9ca3af);
        avatarShadowRig = buildAvatarRig(avatarShadow);
        avatarShadowCorr = makeShadowClone(0x3ddea5);
        avatarShadowCorrRig = buildAvatarRig(avatarShadowCorr);
        scene.add(avatarShadowCorr, avatarShadow, avatar);
        syncAvatarVisibility();
        return avatar;
      }).finally(() => {
        avatarLoadPromise = null;
        btnAvatar.disabled = false;
        btnAvatar.textContent = avatarMode ? "Esqueleto" : "Avatar 3D";
      });
      return avatarLoadPromise;
    }

    let lastFi = -1;
    let lastUiMs = 0;

    /**
     * FPS shared by joints and video seek — same clock both ways.
     * Once container duration is known, always use n/duration so frame↔time
     * stays stable (avoids meta-fps vs mp4 mismatch and pre/post-metadata flip).
     */
    function jointsFps() {
      if (!payload) return 30;
      const metaFps = Number(payload.fps) || 0;
      const n = payload.frames.length;
      const dur = video.duration;
      if (Number.isFinite(dur) && dur > 0 && n > 1) {
        return n / dur;
      }
      return metaFps > 1 ? metaFps : 30;
    }

    function clampFrame(fi) {
      if (!payload) return 0;
      const n = payload.frames.length;
      if (n <= 0) return 0;
      return Math.max(0, Math.min(n - 1, fi | 0));
    }

    /** Current UI frame: scrubber while scrubbing, else last applied frame. */
    function uiFrame() {
      if (!payload) return 0;
      if (scrubbing) return clampFrame(Number(scrub.value));
      if (lastFi >= 0) return lastFi;
      return clampFrame(Number(scrub.value));
    }

    function timeFromFrame(fi) {
      return clampFrame(fi) / jointsFps();
    }

    function frameFromTime(t) {
      if (!payload) return 0;
      const n = payload.frames.length;
      if (n <= 1) return 0;
      const fps = jointsFps();
      const dur = video.duration;
      if (Number.isFinite(dur) && dur > 0) {
        t = Math.min(Math.max(t, 0), dur);
      } else {
        t = Math.max(t, 0);
      }
      // floor + epsilon: frame i owns [i/fps, (i+1)/fps)
      return Math.min(n - 1, Math.max(0, Math.floor(t * fps + 1e-6)));
    }

    function setFrame(fi, { updateUi = true } = {}) {
      if (!payload) return;
      const frames = payload.frames;
      fi = clampFrame(fi);
      // Always refresh UI when asked; pose mesh only when frame changes.
      const poseChanged = fi !== lastFi;
      if (!poseChanged && !updateUi) return;
      lastFi = fi;
      if (poseChanged) {
        const J = chkOracle.checked && trainingOracle?.frames?.[fi]
          ? trainingOracle.frames[fi]
          : frames[fi];
        for (let i = 0; i < jointMeshes.length; i++) {
          const p = J[i];
          jointMeshes[i].position.set(p[0], p[1], p[2]);
        }
        const bones = boneLines.userData.bones;
        const arr = boneLines.geometry.attributes.position.array;
        let o = 0;
        for (const b of bones) {
          const ia = nameToIndex[b.a], ib = nameToIndex[b.b];
          const a = J[ia], c = J[ib];
          arr[o++] = a[0]; arr[o++] = a[1]; arr[o++] = a[2];
          arr[o++] = c[0]; arr[o++] = c[1]; arr[o++] = c[2];
        }
        boneLines.geometry.attributes.position.needsUpdate = true;

        // Feet follow the declared source: MP feet for mediapipe/corrected;
        // teacher foot_landmarks for teacher_aligned (SMPL ankle→foot).
        const allowFeet = !!avatarFootLandmarks && (
          dataSource === "mediapipe"
          || dataSource === "corrected"
          || dataSource === "nlf_s"
          || (dataSource === "teacher_aligned" && avatarFootLandmarks.source === "teacher")
        );
        if (avatarMode) updateAvatarPose(
          avatar, avatarRig, J, avatarMotion,
          allowFeet ? avatarFootLandmarks?.frames?.[fi] : null,
          allowFeet ? avatarFootLandmarks?.body_frames?.[fi] : null,
          allowFeet,
          fi,
        );
        let mpPose = null;
        let corrPose = null;
        if (mpOverlay.payload || teacherOverlay.payload || corrOverlay.payload) {
          mpPose = mpOverlay.updateFrame(fi);
          teacherOverlay.updateFrame(fi);
          corrPose = corrOverlay.updateFrame(fi);
          if (mpPose) updateCorrChip(J, mpPose);
        }
        if (avatarMode && avatarShadow && mpPose && chkShadow.checked) {
          const mpFeet = avatarFootLandmarks?.source !== "teacher" ? avatarFootLandmarks : null;
          updateAvatarPose(
            avatarShadow, avatarShadowRig, mpPose, avatarShadowMotion,
            mpFeet?.frames?.[fi], mpFeet?.body_frames?.[fi],
            !!mpFeet,
            fi,
          );
        }
        if (avatarMode && avatarShadowCorr && corrPose && chkCorrShadow.checked) {
          const mpFeet = avatarFootLandmarks?.source !== "teacher" ? avatarFootLandmarks : null;
          updateAvatarPose(
            avatarShadowCorr, avatarShadowCorrRig, corrPose, avatarShadowCorrMotion,
            mpFeet?.frames?.[fi], mpFeet?.body_frames?.[fi],
            !!mpFeet,
            fi,
          );
        }
      }

      if (updateUi) {
        // Don't fight the range thumb while the user is dragging it.
        if (!scrubbing) scrub.value = String(fi);
        frameInput.max = String(Math.max(0, frames.length - 1));
        if (document.activeElement !== frameInput) {
          frameInput.value = String(fi);
        }
        timeLabel.textContent = `${fi} / ${frames.length - 1}`;
      }
    }

    function meanTargetDelta(corrPose, mpPose) {
      let sum = 0;
      let n = 0;
      for (const name of COMPARE_JOINTS) {
        const ic = nameToIndex[name];
        const im = mpOverlay.nameToIndex[name];
        if (ic == null || im == null) continue;
        const a = corrPose[ic], b = mpPose[im];
        if (!a || !b) continue;
        const dx = a[0] - b[0], dy = a[1] - b[1], dz = a[2] - b[2];
        sum += Math.sqrt(dx * dx + dy * dy + dz * dz);
        n += 1;
      }
      return n ? sum / n : 0;
    }

    function updateCorrChip(corrPose, mpPose) {
      if (!corrChip || dataSource !== "corrected" || !mpPose) {
        if (corrChip) corrChip.classList.remove("on", "corrected", "passthrough");
        return;
      }
      const d = meanTargetDelta(corrPose, mpPose);
      const mm = d * 1000;
      const on = d >= CORRECTED_EPS;
      corrChip.classList.add("on");
      corrChip.classList.toggle("corrected", on);
      corrChip.classList.toggle("passthrough", !on);
      corrChipText.textContent = on
        ? `corrigido · Δ ${mm.toFixed(0)}`
        : `pass-through · Δ ${mm.toFixed(0)}`;
    }

    function frameFromVideoTime() {
      return frameFromTime(video.currentTime || 0);
    }

    function clearSeekLock() {
      seekLockFi = null;
      if (seekClearTimer != null) {
        clearTimeout(seekClearTimer);
        seekClearTimer = null;
      }
    }

    function armSeekLock(fi) {
      seekLockFi = clampFrame(fi);
      seekGen += 1;
      const gen = seekGen;
      if (seekClearTimer != null) clearTimeout(seekClearTimer);
      // Browsers often snap to keyframes — never leave the lock stuck.
      seekClearTimer = setTimeout(() => {
        if (seekGen === gen) clearSeekLock();
      }, 500);
      return gen;
    }

    function syncFromVideo({ updateUi = true } = {}) {
      if (scrubbing) return;
      // Hold the user-requested frame while the decoder catches up.
      if (seekLockFi != null) {
        setFrame(seekLockFi, { updateUi });
        return;
      }
      setFrame(frameFromVideoTime(), { updateUi });
    }

    function seekToFrame(fi, { syncVideo = true } = {}) {
      if (!payload) return;
      fi = clampFrame(fi);
      setFrame(fi, { updateUi: true });
      if (!syncVideo) {
        // Scrubbing: pose follows the slider; video catches up on release.
        return;
      }
      const gen = armSeekLock(fi);
      const apply = () => {
        if (seekGen !== gen) return;
        // Compute time AFTER metadata so jointsFps() uses n/duration, not stale meta.
        const targetT = timeFromFrame(fi);
        try {
          if (Math.abs((video.currentTime || 0) - targetT) < 1e-3) {
            clearSeekLock();
            return;
          }
          video.currentTime = targetT;
        } catch (_) {
          // Not ready yet — lock auto-clears via timer.
        }
      };
      if (video.readyState >= 1) apply();
      else {
        const once = () => {
          video.removeEventListener("loadedmetadata", once);
          if (seekGen === gen) apply();
        };
        video.addEventListener("loadedmetadata", once);
      }
    }

    /** Ensure video.currentTime matches UI frame (hold skeleton via seek lock). */
    function alignVideoToFrame(fi) {
      fi = clampFrame(fi);
      setFrame(fi, { updateUi: true });
      if (video.readyState < 1) {
        clearSeekLock();
        return;
      }
      const targetT = timeFromFrame(fi);
      if (Math.abs((video.currentTime || 0) - targetT) < 1e-2) {
        clearSeekLock();
        return;
      }
      armSeekLock(fi);
      try {
        video.currentTime = targetT;
      } catch (_) {
        clearSeekLock();
      }
    }

    function ensureUpright(frames, jointNames) {
      // If head is below pelvis in Y, flip Y (OpenCV / stale cache / wrong source).
      const pelvis = jointNames.indexOf("pelvis");
      const head = jointNames.indexOf("head");
      if (pelvis < 0 || head < 0 || !frames.length) return frames;
      const mid = frames[Math.floor(frames.length / 2)] || frames[0];
      if (mid[head][1] >= mid[pelvis][1]) return frames;
      return frames.map((f) => f.map((p) => [p[0], -p[1], p[2]]));
    }

    function medianAnkleGround(frames, jointNames) {
      const la = jointNames.indexOf("left_ankle");
      const ra = jointNames.indexOf("right_ankle");
      if (la < 0 || ra < 0 || !frames.length) return 0;
      const samples = [];
      const step = Math.max(1, Math.floor(frames.length / 40));
      for (let i = 0; i < frames.length; i += step) {
        const f = frames[i];
        samples.push(Math.min(f[la][1], f[ra][1]));
      }
      samples.sort((a, b) => a - b);
      return samples[Math.floor(samples.length / 2)] || 0;
    }

    function plantFeetOnGround(frames, jointNames, groundOverride) {
      const ground = groundOverride == null
        ? medianAnkleGround(frames, jointNames)
        : groundOverride;
      if (!ground) return frames.map((f) => f.map((p) => [...p]));
      return frames.map((f) => f.map((p) => [p[0], p[1] - ground, p[2]]));
    }

    async function loadClips() {
      const res = await fetch(`/api/clips?source=${encodeURIComponent(dataSource)}`);
      const data = await res.json();
      if (data.source) dataSource = data.source;
      syncSourceButtons();
      const label = data.label || sourceLabel(dataSource);
      sourceBadge.textContent = label;
      document.title = `Pose Lab — ${label}`;
      const isCorr = dataSource === "corrected";
      const isNlf = dataSource === "nlf_s";
      const isTeacherAligned = dataSource === "teacher_aligned";
      overlayToggleWrap.hidden = !(isCorr || isNlf);
      teacherToggleWrap.hidden = !isCorr;
      corrShadowToggleWrap.hidden = !isNlf;
      oracleToggleWrap.hidden = !isTeacherAligned;
      chkOracle.checked = false;
      chkOracle.disabled = true;
      if (isNlf) {
        chkTeacherLabel.textContent = "Teacher";
        chkCorrShadow.checked = true;
        chkShadow.checked = true;
      }
      if (!isCorr && !isNlf) {
        chkShadow.checked = false;
        chkTeacher.checked = false;
        chkCorrShadow.checked = false;
        corrChip.classList.remove("on", "corrected", "passthrough");
        mpOverlay.clear();
        mpOverlay.payload = null;
        teacherOverlay.clear();
        teacherOverlay.payload = null;
        corrOverlay.clear();
        corrOverlay.payload = null;
      }
      const clips = Array.isArray(data.clips) ? data.clips : [];
      const want = clip || data.current || "";
      // Resolve clip BEFORE touching <select> so a synthetic "change" cannot
      // request a MediaPipe-only id against the Corrector root (404 + full-pane err).
      if (want && clips.includes(want)) {
        clip = want;
      } else if (data.current && clips.includes(data.current)) {
        clip = data.current;
      } else if (clips.length) {
        clip = clips[0];
      } else {
        clip = "";
        errBox.hidden = false;
        errBox.textContent = `Nenhum clip pronto em ${label}.`;
      }
      suppressClipChange = true;
      try {
        clipSelect.innerHTML = "";
        for (const c of clips) {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          clipSelect.appendChild(opt);
        }
        if (clip) clipSelect.value = clip;
      } finally {
        suppressClipChange = false;
      }
    }

    async function loadOverlay(overlay, url, label) {
      overlay.clear();
      overlay.payload = null;
      if (!overlaysEnabled()) return;
      const res = await fetch(url);
      if (!res.ok) {
        console.warn(`${label} overlay unavailable`, res.status);
        return;
      }
      overlay.payload = await res.json();
    }

    async function prepareOverlay(overlay, ground) {
      if (!overlay.payload || !overlay.payload.frames) return;
      overlay.payload.frames = ensureUpright(
        overlay.payload.frames,
        overlay.payload.joint_names,
      );
      overlay.payload.frames = plantFeetOnGround(
        overlay.payload.frames,
        overlay.payload.joint_names,
        ground,
      );
      if (overlay.payload.frames.length !== payload.frames.length) {
        console.warn(
          `overlay T=${overlay.payload.frames.length} vs main T=${payload.frames.length}`,
        );
      }
      overlay.build(overlay.payload.joint_names, overlay.payload.bones);
    }

    function updateUrl() {
      const q = new URLSearchParams();
      if (clip) q.set("clip", clip);
      if (dataSource) q.set("source", dataSource);
      history.replaceState(null, "", `/?${q.toString()}`);
    }

    async function loadPayload(id) {
      if (!id) return;
      const gen = ++loadGen;
      const srcAtStart = dataSource;
      errBox.hidden = true;
      titleMeta.textContent = `carregando ${sourceLabel(srcAtStart)}…`;
      const res = await fetch(
        `/api/payload.json?clip=${encodeURIComponent(id)}&source=${encodeURIComponent(srcAtStart)}`,
      );
      if (gen !== loadGen) return;
      if (!res.ok) {
        errBox.hidden = false;
        errBox.textContent =
          res.status === 404
            ? `Clip “${id}” não existe em ${sourceLabel(srcAtStart)}. Escolha outro na lista.`
            : `Falha ao carregar payload de ${id} (${srcAtStart})`;
        titleMeta.textContent = "falha ao carregar";
        return;
      }
      const nextPayload = await res.json();
      if (gen !== loadGen) return;
      payload = nextPayload;
      avatarFootLandmarks = null;
      poseAux = null;
      trainingOracle = null;
      if (avatar) {
        resetAvatarMotion(avatar, avatarMotion);
        if (avatarRig) resetRetargetFilters(avatarRig);
      }
      if (avatarShadow) {
        resetAvatarMotion(avatarShadow, avatarShadowMotion);
        if (avatarShadowRig) resetRetargetFilters(avatarShadowRig);
      }
      if (avatarShadowCorr) {
        resetAvatarMotion(avatarShadowCorr, avatarShadowCorrMotion);
        if (avatarShadowCorrRig) resetRetargetFilters(avatarShadowCorrRig);
      }
      if (payload.source) dataSource = payload.source;
      syncSourceButtons();
      lastFi = -1;
      scrubbing = false;
      if (scrubRaf) {
        cancelAnimationFrame(scrubRaf);
        scrubRaf = 0;
      }
      clearSeekLock();
      seekGen += 1;
      const overlayLoads = [
        loadOverlay(mpOverlay, `/api/shadow.json?clip=${encodeURIComponent(id)}`, "MP"),
      ];
      if (dataSource === "corrected") {
        overlayLoads.push(
          loadOverlay(teacherOverlay, `/api/teacher.json?clip=${encodeURIComponent(id)}`, "teacher"),
        );
        corrOverlay.clear();
        corrOverlay.payload = null;
      } else if (dataSource === "nlf_s") {
        teacherOverlay.clear();
        teacherOverlay.payload = null;
        overlayLoads.push(
          loadOverlay(
            corrOverlay,
            `/api/corrected_shadow.json?clip=${encodeURIComponent(id)}`,
            "corrected",
          ),
        );
      }
      await Promise.all(overlayLoads);
      if (gen !== loadGen) return;
      const srcLabel = sourceLabel(dataSource);
      titleMeta.textContent = `${srcLabel} · ${id}`;
      sourceBadge.textContent = srcLabel;
      // Normalize orientation + feet to grid (same ground for overlays).
      payload.frames = ensureUpright(payload.frames, payload.joint_names);
      const ground = medianAnkleGround(payload.frames, payload.joint_names);
      payload.frames = plantFeetOnGround(payload.frames, payload.joint_names, ground);
      await prepareOverlay(mpOverlay, ground);
      await prepareOverlay(teacherOverlay, ground);
      await prepareOverlay(corrOverlay, ground);
      if (gen !== loadGen) return;
      mpOverlay.setVisible(chkShadow.checked);
      teacherOverlay.setVisible(dataSource === "corrected" && chkTeacher.checked);
      corrOverlay.setVisible(dataSource === "nlf_s" && chkCorrShadow.checked);
      buildSkeleton(payload.joint_names, payload.bones);
      syncAvatarVisibility();
      const maxFi = Math.max(0, payload.frames.length - 1);
      scrub.max = String(maxFi);
      frameInput.max = String(maxFi);
      frameInput.value = "0";
      video.src = payload.video;
      video.load();
      frameCameraOnSkeleton(payload.frames);
      seekToFrame(0);
      resize();
      updateUrl();
      if (dataSource === "teacher_aligned") {
        void fetch(`/api/training-oracle.json?clip=${encodeURIComponent(id)}`)
          .then((response) => response.ok ? response.json() : null)
          .then((oracle) => {
            if (gen !== loadGen || !oracle?.frames) return;
            oracle.frames = ensureUpright(oracle.frames, oracle.joint_names);
            oracle.frames = plantFeetOnGround(oracle.frames, oracle.joint_names, ground);
            if (oracle.frames.length !== payload.frames.length) {
              console.warn(`training oracle T=${oracle.frames.length} vs main T=${payload.frames.length}`);
              return;
            }
            trainingOracle = oracle;
            chkOracle.disabled = false;
          })
          .catch(() => {});
      }
      const footUrl = dataSource === "teacher_aligned"
        ? `/media/teacher_aligned/${encodeURIComponent(id)}/foot_landmarks.json`
        : (dataSource === "mediapipe" || dataSource === "corrected" || dataSource === "nlf_s")
          ? `/media/mediapipe/${encodeURIComponent(id)}/foot_landmarks.json`
          : null;
      if (footUrl) {
        void fetch(footUrl)
          .then((response) => response.ok ? response.json() : null)
          .then((footData) => {
            if (gen !== loadGen || !footData?.frames || !footData?.body_frames) return;
            if (!footData.source) {
              footData.source = dataSource === "teacher_aligned" ? "teacher" : "mediapipe";
            }
            avatarFootLandmarks = footData;
            if (!avatarMode || lastFi < 0) return;
            const currentFi = lastFi;
            lastFi = -1;
            setFrame(currentFi);
          })
          .catch(() => {});
      }
      // NLF: use SMPL avatar_aux from payload (aligned). Else Pose-33 MP aux for MP/corrected.
      if (dataSource === "nlf_s" && payload?.avatar_aux?.frames?.length) {
        poseAux = payload.avatar_aux;
      } else if (
        dataSource === "mediapipe"
        || dataSource === "corrected"
      ) {
        void fetch(`/api/pose-aux.json?clip=${encodeURIComponent(id)}`)
          .then((response) => response.ok ? response.json() : null)
          .then((auxData) => {
            if (gen !== loadGen || !auxData?.frames?.length) return;
            poseAux = auxData;
            if (!avatarMode || lastFi < 0) return;
            const currentFi = lastFi;
            lastFi = -1;
            setFrame(currentFi);
          })
          .catch(() => {});
      } else if (dataSource === "nlf_s") {
        // No avatar_aux baked yet — don't use mismatched MP face/hands on NLF body.
        poseAux = null;
      }
    }

    async function switchSource(next) {
      if (!next || next === dataSource) return;
      dataSource = next;
      syncSourceButtons();
      await loadClips();
      if (clip) await loadPayload(clip);
      else {
        clearSkeleton();
        payload = null;
      }
    }

    sourceBar.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-source]");
      if (!btn) return;
      switchSource(btn.dataset.source);
    });

    chkShadow.addEventListener("change", () => {
      syncAvatarVisibility();
      if (payload && lastFi >= 0) {
        const fi = lastFi;
        lastFi = -1;
        setFrame(fi);
      }
    });
    chkCorrShadow.addEventListener("change", () => {
      syncAvatarVisibility();
      if (payload && lastFi >= 0) {
        const fi = lastFi;
        lastFi = -1;
        setFrame(fi);
      }
    });
    chkTeacher.addEventListener("change", () => {
      syncAvatarVisibility();
    });
    chkOracle.addEventListener("change", () => {
      const frame = uiFrame();
      if (avatar) resetAvatarMotion(avatar, avatarMotion);
      lastFi = -1;
      setFrame(frame);
    });
    btnAvatar.addEventListener("click", async () => {
      const nextMode = !avatarMode;
      if (nextMode) {
        try {
          await loadAvatar();
        } catch (error) {
          errBox.hidden = false;
          errBox.textContent = `Falha ao carregar avatar: ${error.message || error}`;
          return;
        }
      }
      avatarMode = nextMode;
      btnAvatar.classList.toggle("active", avatarMode);
      btnAvatar.textContent = avatarMode ? "Esqueleto" : "Avatar 3D";
      if (avatarMode) {
        resetAvatarMotion(avatar, avatarMotion);
        if (avatarShadow) resetAvatarMotion(avatarShadow, avatarShadowMotion);
        controls.target.set(0, 0.9, 0);
        camera.position.set(1.55, 1.45, 2.35);
        controls.update();
        if (payload) {
          lastFi = -1;
          setFrame(uiFrame(), { updateUi: false });
        }
      } else {
        if (avatar) {
          avatar.position.set(0, 0, 0);
          resetAvatarMotion(avatar, avatarMotion);
        }
        if (avatarShadow) {
          avatarShadow.position.set(0, 0, 0);
          resetAvatarMotion(avatarShadow, avatarShadowMotion);
        }
      }
      syncAvatarVisibility();
    });
    clipSelect.addEventListener("change", () => {
      if (suppressClipChange) return;
      clip = clipSelect.value;
      loadPayload(clip);
    });
    document.getElementById("btnReload").onclick = () => loadPayload(clip);
    document.getElementById("btnResetCam").onclick = () => {
      if (payload) frameCameraOnSkeleton(payload.frames);
      else {
        camera.position.copy(DEFAULT_CAM_POS);
        controls.target.copy(DEFAULT_TARGET);
        controls.update();
      }
    };
    btnPlay.onclick = () => {
      if (!video.paused) {
        video.pause();
        return;
      }
      // Drop any stuck scrubbing flag and play FROM the current UI frame.
      scrubbing = false;
      if (scrubRaf) {
        cancelAnimationFrame(scrubRaf);
        scrubRaf = 0;
      }
      const fi = uiFrame();
      alignVideoToFrame(fi);
      const p = video.play();
      if (p && typeof p.catch === "function") p.catch(() => {});
    };
    video.addEventListener("play", () => {
      // Native controls or our button — never leave scrubbing stuck.
      scrubbing = false;
      // Keep seek lock until seeked if play() raced ahead of currentTime seek.
      if (!video.seeking) clearSeekLock();
      btnPlay.textContent = "Pause";
    });
    video.addEventListener("pause", () => {
      btnPlay.textContent = "Play";
      if (payload && !scrubbing) {
        syncFromVideo({ updateUi: true });
        requestAnimationFrame(() => syncFromVideo({ updateUi: true }));
      }
    });
    // After a user seek, adopt decoder time so video pixels and skeleton match.
    // Ignore seeked that lands far from the locked target (stale/superseded seeks).
    video.addEventListener("seeked", () => {
      if (scrubbing) return;
      if (seekLockFi != null) {
        const landed = frameFromVideoTime();
        // More than ~0.5s of frames away → treat as stale intermediate seeked.
        const tol = Math.max(8, Math.round(jointsFps() * 0.5));
        if (Math.abs(landed - seekLockFi) > tol) {
          setFrame(seekLockFi, { updateUi: true });
          return;
        }
        clearSeekLock();
      }
      if (payload) syncFromVideo({ updateUi: true });
    });
    // timeupdate is ~4 Hz — keep UI scrubber in sync, but pose follows rAF below
    video.addEventListener("timeupdate", () => {
      if (scrubbing) return;
      syncFromVideo({ updateUi: true });
    });
    function beginScrub(e) {
      scrubbing = true;
      clearSeekLock();
      // Pause so playback / decoder seeks don't yank the slider mid-drag.
      if (!video.paused) video.pause();
      // Capture so pointerup outside the thumb still ends scrub (avoids stuck flag).
      if (e && e.pointerId != null && scrub.setPointerCapture) {
        try { scrub.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      }
    }
    function onScrubInput() {
      if (!payload) return;
      if (!scrubbing) beginScrub();
      const fi = Number(scrub.value);
      if (scrubRaf) cancelAnimationFrame(scrubRaf);
      scrubRaf = requestAnimationFrame(() => {
        scrubRaf = 0;
        if (!scrubbing) return;
        seekToFrame(fi, { syncVideo: false });
      });
    }
    function endScrub() {
      if (!scrubbing) return;
      if (scrubRaf) {
        cancelAnimationFrame(scrubRaf);
        scrubRaf = 0;
      }
      const fi = Number(scrub.value);
      scrubbing = false;
      seekToFrame(fi, { syncVideo: true });
    }
    scrub.addEventListener("pointerdown", beginScrub);
    scrub.addEventListener("input", onScrubInput);
    scrub.addEventListener("change", endScrub);
    scrub.addEventListener("pointerup", endScrub);
    scrub.addEventListener("pointercancel", endScrub);
    scrub.addEventListener("lostpointercapture", endScrub);
    // Safety: if the pointer is released anywhere, never leave scrubbing stuck.
    window.addEventListener("pointerup", endScrub);
    window.addEventListener("pointercancel", endScrub);
    function jumpFromInput() {
      if (!payload) return;
      scrubbing = false;
      if (scrubRaf) {
        cancelAnimationFrame(scrubRaf);
        scrubRaf = 0;
      }
      const raw = Number(frameInput.value);
      if (!Number.isFinite(raw)) return;
      seekToFrame(raw, { syncVideo: true });
    }
    btnGo.addEventListener("click", jumpFromInput);
    frameInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        jumpFromInput();
      }
    });
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target === document.body) {
        e.preventDefault();
        btnPlay.click();
      }
    });

    function animate(now) {
      requestAnimationFrame(animate);
      // Sync skeleton every paint while playing (timeupdate alone looks like ~4 fps).
      // Skip while scrubbing / seek-locked so user jumps are not overwritten.
      if (payload && !scrubbing && !video.paused && !video.seeking && seekLockFi == null) {
        const ui = now - lastUiMs > 100;
        if (ui) lastUiMs = now;
        syncFromVideo({ updateUi: ui });
      }
      controls.update();
      cameraLight.position.copy(camera.position);
      renderer.render(scene, camera);
    }

    await loadClips();
    if (clip) await loadPayload(clip);
    resize();
    animate();
  </script>
</body>
</html>
