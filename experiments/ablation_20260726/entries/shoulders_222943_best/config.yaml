seed: 42
dataset_config: configs/dataset.yaml

model:
  name: gru  # gru (v1) | tcn_causal (not implemented yet)
  hidden: 256
  layers: 2
  dropout: 0.1
  kernel_size: 3  # TCN (unused for gru)
  aux_motion: true
  max_params_m: 2.0

optim:
  name: adamw
  lr: 3.0e-4
  weight_decay: 0.01
  epochs: 80
  batch_size: 64
  grad_clip: 1.0
  warmup_epochs: 3
  hard_warmup_epochs: 5
  amp: true

loss:
  huber_delta: 0.05
  w_delta: 1.0
  w_passthrough: 0.5
  w_bone: 0.1
  w_smooth: 0.05
  w_aux: 0.2
  label_smoothing: 0.1
  shoulder_weight: 1.0
  elbow_weight: 1.0
  wrist_weight: 1.25

eval:
  every_epochs: 1
  early_stop_metric: val/mpjpe_hard_mm
  early_stop_mode: min
  patience: 15
  easy_max_regression: 0.03

logging:
  dir: runs
  tensorboard: true
  jsonl: true

inference_gate:
  conf_high: 0.85
  delta_eps: 0.02  # body-frame units
