<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>HEAVY HANDS</title><link rel="stylesheet" href="/static/boxing_ui.css"><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body>
<canvas id="arena" data-i18n-aria="arenaLabel" aria-label="HEAVY HANDS boxing ring"></canvas><div class="vignette"></div><div id="screenFx" aria-hidden="true"></div><div id="fxLayer" aria-hidden="true"></div><div id="voiceCaption" class="voice-caption" aria-live="off" hidden><strong></strong></div>
<div id="debugCapture"><button id="debugRecord" type="button" data-i18n-aria="record" data-i18n-title="record" aria-pressed="false"><i></i></button><span id="debugRecordStatus" role="status" hidden></span></div><div id="banner" aria-live="polite"></div>
<header><a class="brand" href="/static/boxing.html" data-i18n-aria="brandLabel"><span>HEAVY</span><span>HANDS<span class="brand-dot">.</span></span></a><div class="live-tag"><i></i><span id="networkStatus">TRAINING</span></div><button id="settingsButton" class="chip" data-i18n="settings">Settings</button></header>
<section id="hud" hidden>
<div class="fighter left"><div class="plate"><span class="badge">P1</span><div><small>BLUE CORNER</small><strong>YOU</strong></div></div><div class="health"><b id="hpGhost0"></b><i id="hp0"></i></div><div class="meta"><span id="stun0" class="status">READY</span><div class="power" data-i18n-title="forceTip"><i id="pow0"></i><em id="powLabel0"></em></div></div><div id="combo0" class="combo"></div></div>
<div class="round"><small id="roundLabel">ROUND 1 / 3</small><b id="timer">01:30</b><span id="fightState">TRAINING</span></div>
<div class="fighter right"><div class="plate"><span class="badge">CPU</span><div><small>RED CORNER</small><strong id="opponentName">SPARRING</strong></div></div><div class="health"><b id="hpGhost1"></b><i id="hp1"></i></div><div class="meta"><span id="stun1" class="status">READY</span><div class="power" data-i18n-title="forceTip"><i id="pow1"></i><em id="powLabel1"></em></div></div><div id="combo1" class="combo"></div></div>
</section>
<main id="lobby"><div class="lobby-beam"></div><div class="lobby-shade"></div><div class="lobby-logo"><b>HEAVY</b><b>HANDS</b><span data-i18n="tagline">BOX WITH YOUR BODY</span></div><div class="lobby-menu"><button id="train" class="primary" data-i18n="training" disabled>Training</button><button id="online" class="secondary" data-i18n="online" disabled>Online</button><button id="lobbyCamera" class="camera-chip" data-i18n-title="cameraInstruction"><i></i><span id="cameraChipText" data-i18n="noCamera">Turn on webcam</span></button><div id="loadStatus" role="status"><progress id="loadProgress" data-i18n-aria="loadingLabel"></progress></div><button id="soundHint" class="chip" hidden data-i18n="soundOn">Sound on</button></div><div class="fighter-card"><small data-i18n="yourFighter">YOUR FIGHTER</small><strong id="fighterName">PRISM</strong><em id="fighterStyle"></em><div id="fighterStats"></div><div class="fighter-pick"><button id="fighterPrev" data-i18n-aria="fighter">‹</button><button id="fighterNext" data-i18n-aria="fighter">›</button></div></div><div id="peakRecord" hidden><small>PEAK</small><strong id="peakValue"></strong></div></main>
<aside id="guide" hidden><p id="tip" data-i18n="cameraInstruction">Step back until your whole body is in frame.</p><div class="guide-actions"><button id="cameraButton" class="chip" data-i18n="webcam">Webcam</button><button id="calibrate" class="chip" data-i18n="calibrate">Calibrate</button></div><span id="trackingStatus" data-i18n="noCamera">No camera</span><video id="preview" autoplay muted playsinline hidden></video></aside><div id="combatMessage" role="status" aria-live="polite"></div>
<footer><button id="viewButton" class="chip" data-i18n="third">Third person</button><button id="exit" class="chip" hidden data-i18n="back">Back</button></footer>
<dialog id="settings"><div class="dialog-top"><h2 data-i18n="settings">Settings</h2><button data-close="settings" data-i18n-aria="close">×</button></div>
<label><span data-i18n="language">Language</span><select id="language"><option value="en" data-i18n="englishLanguage">English</option><option value="pt" data-i18n="portugueseLanguage">Portuguese</option></select></label>
<label><span data-i18n="fighter">Fighter</span><select id="avatarSelect"></select></label>
<label><span data-i18n="view">View</span><select id="view"><option value="third" data-i18n="third">Third person</option><option value="first" data-i18n="first">First person</option></select></label>
<label class="range-label" data-i18n-title="smoothTip"><span data-i18n="smoothing">Smoothing</span><output id="smoothValue">50%</output><input id="smooth" type="range" min="0" max="100" value="50"></label>
<label data-i18n-title="massTip"><span data-i18n="mass">Body mass</span><div><input id="bodyKg" type="number" min="40" max="180" step="1" value="80"> kg</div></label>
<label><span data-i18n="style">Style</span><select id="artStyle"><option value="toon" data-i18n="cartoon">Cartoon</option><option value="classic" data-i18n="original">Original</option></select></label>
<label><span data-i18n="venue">Arena</span><select id="venue"><option value="night" data-i18n="night">Night</option><option value="dawn" data-i18n="dawn">Dawn</option></select></label>
<label class="check"><input id="fxShake" type="checkbox" checked><span data-i18n="effects">Camera shake</span></label><label class="check"><input id="depth" type="checkbox" checked><span data-i18n="depth">Forward / back</span></label><label class="check"><input id="audio" type="checkbox" checked><span data-i18n="sound">Sound</span></label>
<label><span data-i18n="volume">Volume</span><input id="volume" type="range" min="0" max="100" value="50"></label><label><span data-i18n="music">Music</span><input id="musicVolume" type="range" min="0" max="100" value="70"></label><label><span data-i18n="voice">Announcer</span><input id="voiceVolume" type="range" min="0" max="100" value="85"></label><label class="check" data-i18n-title="reducedTip"><input id="reducedImpact" type="checkbox"><span data-i18n="reducedImpact">Reduced impact sound</span></label><a class="credits" href="/assets/boxing_audio/CREDITS.md" target="_blank" rel="noopener" data-i18n="credits">Credits</a></dialog>
<dialog id="match"><div class="dialog-top"><h2 data-i18n="online">Online</h2><button data-close="match" data-i18n-aria="close">×</button></div><label><span data-i18n="server">Server</span><input id="server" placeholder="wss://server/boxing"></label><label><span data-i18n="room">Room</span><input id="room" value="HEAVY1" maxlength="24" autocomplete="off"></label><label><span data-i18n="connection">Connection</span><select id="transport"><option value="relay" data-i18n="relay">Relay</option><option value="p2p" data-i18n="p2p">Peer to peer</option></select></label><p class="muted" data-i18n="privacy">Only poses are sent. Video never leaves your computer.</p><button id="join" class="primary" data-i18n="join">Join</button><p id="roomStatus" role="status"></p></dialog>
<dialog id="result"><small data-i18n="result">Result</small><h2 id="resultTitle"></h2><p id="resultText"></p><div id="resultStats" class="stats"></div><div id="resultSupport"></div><div id="resultTimeline" class="timeline" data-i18n-aria="timeline"></div><button id="again" class="primary" data-i18n="back">Back</button></dialog>
<iframe id="tracker" src="/live?gameBridge=1" allow="camera" title="Camera" hidden></iframe><script type="module" src="/static/boxing.js"></script>
</body></html>
